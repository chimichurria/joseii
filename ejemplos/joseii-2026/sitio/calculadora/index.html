<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>¿Cuánto ocupa un millón?</title>
<style>
:root{color-scheme:light;--red:#FF3300;--ora:#FF9900;--gray:#5f6a6e;--steel:#485458;--ink:#1B1F21;--line:#E4E7E8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
.marca{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);margin-bottom:14px}
.marca b{color:var(--red)}
h1{font-size:29px;font-size:clamp(26px,7.5vw,34px);line-height:1.14;margin-bottom:8px;letter-spacing:-.01em}
h1 span{background:linear-gradient(90deg,#FF3300,#FF9900);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:17px;line-height:1.45;color:var(--gray);margin-bottom:22px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tarjeta{border:1px solid var(--line);border-radius:18px;padding:16px}
.tarjeta b{display:block;font-size:40px;font-size:clamp(34px,11vw,48px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tarjeta.gr b{background:linear-gradient(90deg,#FF3300,#FF9900);-webkit-background-clip:text;background-clip:text;color:transparent}
.tarjeta span{display:block;font-size:15px;color:var(--gray);margin-top:6px}
.cuenta{font-size:15px;line-height:1.5;color:var(--steel);min-height:46px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.aviso{font-size:16px;font-weight:700;color:#B42318;min-height:22px;margin-bottom:12px}
.campo{margin-bottom:20px}
label{display:flex;justify-content:space-between;gap:12px;font-size:16px;color:var(--gray);margin-bottom:6px}
label b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:36px;accent-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
.chip{min-height:46px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer}
.chip.on{border-color:transparent;background:linear-gradient(90deg,#FF3300,#FF8A1A);color:#fff}
.chip:focus-visible,input:focus-visible{outline:3px solid rgba(255,51,0,.35);outline-offset:2px}
.check{display:flex;align-items:center;justify-content:flex-start;gap:12px;min-height:48px;font-size:16px;cursor:pointer;margin-bottom:22px;color:var(--ink)}
.check input{width:24px;height:24px;accent-color:var(--red)}
.canchas{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.canchas i{height:18px;border-radius:3px;background:#EEF0F1;transition:background .25s}
.canchas i.on{background:linear-gradient(135deg,#FF9900,#FF3300)}
.pie{font-size:14px;line-height:1.45;color:var(--gray);margin-top:10px}
@supports (aspect-ratio:1/1){.canchas i{height:auto;aspect-ratio:105/68}}
.comp{list-style:none;margin:0 0 14px;font-size:16px;line-height:1.35;color:var(--gray)}
.comp li{padding:7px 0;border-top:1px solid var(--line)}
.comp li.sala{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div class="marca">JoSEII <b>Rosario 2026</b></div>
<h1>¿Cuánto ocupa <span>un millón</span> de personas?</h1>
<p class="lead">Probá tus propios supuestos. El número cambia según lo que des por cierto.</p>
<div class="res">
  <div class="tarjeta"><b id="ha">50</b><span>hectáreas</span></div>
  <div class="tarjeta gr"><b id="ca">70</b><span>canchas de fútbol</span></div>
</div>
<ul class="comp" id="comp" aria-live="polite"></ul>
<p class="aviso" id="aviso" role="status"></p>
<p class="cuenta" id="cuenta"></p>
<div class="campo">
  <label for="pop">Personas <b id="pv"></b></label>
  <input type="range" id="pop" min="0" max="2000000" step="50000" value="1000000">
</div>
<div class="campo" style="margin-bottom:10px">
  <label for="den">Personas por m² <b id="dv"></b></label>
  <input type="range" id="den" min="0" max="6" step="0.5" value="2">
</div>
<div class="chips" id="chips">
  <button class="chip" data-d="2">Cómodo</button>
  <button class="chip" data-d="4">Recital</button>
  <button class="chip" data-d="5">Muy apretado</button>
</div>
<label class="check"><input type="checkbox" id="circ"> Sumar 30% de calles y accesos</label>
<div class="canchas" id="canchas" aria-hidden="true"></div>
<p class="pie" id="pie">Cada rectángulo es una cancha de 105 × 68 m, o sea 7.140 m². Se muestran hasta 100.</p>
<script>
(function(){
var pop=document.getElementById('pop'),den=document.getElementById('den'),circ=document.getElementById('circ'),C=document.getElementById('canchas'),chips=[].slice.call(document.querySelectorAll('.chip'));
for(var i=0;i<100;i++)C.appendChild(document.createElement('i'));
var celdas=[].slice.call(C.children);
function nf(n){return Math.round(n).toLocaleString('es-AR')}
var COMP=[['A',.714,'canchas de fútbol'],['B',1,'manzanas de Rosario'],['C',126,'Parques de la Independencia'],['D',178.69,'% de la ciudad de Rosario']],gana=null;
function num(n){return n>=10?nf(n):n.toLocaleString('es-AR',{maximumFractionDigits:2})}
function compara(h){var u=document.getElementById('comp');u.innerHTML='';COMP.forEach(function(c){var li=document.createElement('li');li.textContent=(h>0?num(h/c[1]):'—')+' '+c[2]+(gana===c[0]?' · la eligió la sala':'');if(gana===c[0])li.className='sala';u.appendChild(li)})}
function calc(){var p=+pop.value,d=+den.value,k=circ.checked?1.3:1;
 document.getElementById('pv').textContent=nf(p);document.getElementById('dv').textContent=d.toLocaleString('es-AR',{minimumFractionDigits:1});
 chips.forEach(function(c){c.classList.toggle('on',+c.dataset.d===d)});
 var aviso=document.getElementById('aviso'),cuenta=document.getElementById('cuenta'),ha=document.getElementById('ha'),ca=document.getElementById('ca');
 if(d<=0){aviso.textContent='Con densidad 0 el cálculo no tiene sentido.';ha.textContent='—';ca.textContent='—';cuenta.textContent='';compara(0);celdas.forEach(function(c){c.classList.remove('on')});return}
 var m2=p/d*k,h=m2/1e4,cc=m2/7140;aviso.textContent=p===0?'Con 0 personas no hay nada que medir.':'';
 ha.textContent=nf(h);ca.textContent=nf(cc);compara(h);
 cuenta.textContent=nf(p)+' ÷ '+d.toLocaleString('es-AR')+(k>1?' × 1,3':'')+' = '+nf(m2)+' m² = '+nf(h)+' ha';
 celdas.forEach(function(c,i){c.classList.toggle('on',i<Math.min(100,Math.round(cc)))})}
[pop,den,circ].forEach(function(x){x.addEventListener('input',calc);x.addEventListener('change',calc)});
chips.forEach(function(c){c.addEventListener('click',function(){den.value=c.dataset.d;calc()})});
calc();
if(window.fetch)fetch('/api/resultados?e=pedido').then(function(r){return r.json()}).then(function(j){var c=(j.conteos&&j.conteos.pedido)||{},m=0;Object.keys(c).forEach(function(k){if(c[k]>m){m=c[k];gana=k}});calc()}).catch(function(){});
})();
</script>
<script>
/* Vuelve a la charla cuando se abre una votacion o llega el cierre. */
(function(){var d0;setInterval(function(){fetch('/api/estado').then(function(r){return r.json()}).then(function(e){if(d0===undefined)d0=e.diapositiva;var abiertas=(e.encuestas||[]).filter(function(x){return x.id!=='carrera'}).length;if(abiertas||(d0<24&&e.diapositiva>=24))location.href='/'}).catch(function(){})},4000)})();
</script>
</body>
</html>
