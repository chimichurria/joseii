<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1B1F21">
<meta name="robots" content="noindex">
<title>Control de la charla</title>
<style>
:root{color-scheme:dark;--c1:#FF3300;--c2:#FF9900;--bg:#14181A;--panel:#1E2427;--line:#2C3438;--tx:#F1F4F5;--gray:#9AA6AB;--ok:#3fbf85}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.oculto{display:none!important}
#pin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#pin h1{font-size:26px}
.puntos{display:flex;gap:12px;min-height:16px}
.puntos i{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2))}
#pinMsg{color:var(--gray);font-size:16px;min-height:22px;text-align:center}
.teclas{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.teclas button{height:76px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:28px;font-weight:700}
.teclas button:active{background:#2a3236}
.teclas button.entrar{background:linear-gradient(135deg,var(--c1),var(--c2));border:0;font-size:17px}
#app{flex:1;display:flex;flex-direction:column;min-height:0;gap:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.num{font-size:34px;font-weight:700;line-height:1}
.num span{font-size:17px;color:var(--gray);font-weight:400}
.tit{font-size:15px;color:var(--gray);margin-top:6px;line-height:1.3;overflow-wrap:anywhere}
.reloj{text-align:right;flex:none}
.reloj b{display:block;font-size:30px;font-family:Consolas,Menlo,monospace;line-height:1}
.reloj small{font-size:13px;color:var(--gray)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--panel);padding:5px;border-radius:14px}
.nav button{position:relative;height:42px;border:0;border-radius:10px;background:none;font-size:14px;font-weight:700;color:var(--gray)}
.nav button.on{background:#2f393c;color:var(--tx)}
.nav em{position:absolute;top:3px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--c1);color:#fff;font-size:11px;font-style:normal;line-height:18px}
.vista{display:none;flex:1;min-height:0;flex-direction:column;gap:12px}
.vista.on{display:flex}
.notas{flex:1;min-height:0;overflow:auto;background:var(--panel);border-radius:16px;padding:16px;font-size:19px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.fila{display:flex;gap:10px}
.chico{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:700;padding:0 10px}
.chico.activo{border-color:var(--c2);color:var(--c2)}
.mandos{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.mandos button{height:96px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-size:19px;font-weight:700}
.mandos button:last-child{border:0;background:linear-gradient(90deg,var(--c1),var(--c2));font-size:22px}
.mandos button:active{transform:scale(.98)}
.scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.bloque{background:var(--panel);border-radius:16px;padding:14px}
.bloque h2{font-size:17px;margin-bottom:10px;line-height:1.3}
.barra{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:15px;margin-top:10px}
.barra b{font-family:Consolas,Menlo,monospace}
.barra div{grid-column:1/-1;height:8px;border-radius:4px;background:#2c3438;overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .5s}
.vacio{color:var(--gray);font-size:15px;line-height:1.4}
.sec{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin-top:4px}
.preg{background:var(--panel);border-radius:16px;padding:14px;font-size:17px;line-height:1.4;overflow-wrap:anywhere}
.acc{display:flex;gap:8px;margin-top:12px}
.acc button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:none;font-size:14px;font-weight:700}
.acc button.si{border:0;background:linear-gradient(90deg,var(--c1),var(--c2))}
.palabra{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;padding:6px 0}
.palabra button{min-height:36px;border-radius:10px;border:1px solid var(--line);background:none;font-size:13px;padding:0 12px}
.grande{min-height:56px;border-radius:16px;border:0;background:linear-gradient(90deg,var(--c1),var(--c2));font-size:17px;font-weight:700;flex:none}
.grande.cerrar{background:var(--panel);border:1px solid var(--line)}
.peligro{min-height:46px;border-radius:12px;border:1px solid #6b2a22;background:none;color:#ff8a7a;font-size:14px;font-weight:700;flex:none}
.dia{display:flex;gap:12px;align-items:baseline;text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:16px;flex:none}
.dia b{font-family:Consolas,Menlo,monospace;color:var(--c2);flex:none}
.dia.act{border-color:var(--c1)}
.estado{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray);flex:none}
.estado i{width:9px;height:9px;border-radius:50%;background:var(--c1);flex:none}
.estado.ok i{background:var(--ok)}
.estado button{margin-left:auto;border:0;background:none;color:var(--gray);font-size:13px;text-decoration:underline}
</style>
</head>
<body>
<section id="pin">
  <h1>Control de la charla</h1>
  <div class="puntos" id="puntos" aria-hidden="true"></div>
  <p id="pinMsg" role="status">Ingresá tu PIN</p>
  <div class="teclas" id="teclas"></div>
</section>
<section id="app" class="oculto">
  <div class="top">
    <div><div class="num"><span id="dNum" style="font-size:34px;color:var(--tx);font-weight:700">–</span><span> / <span id="dTot">–</span></span></div><div class="tit" id="dTit">Esperando la presentación…</div></div>
    <div class="reloj"><b id="relojT">00:00</b><small id="relojP">sin iniciar</small></div>
  </div>
  <div class="nav" id="nav">
    <button data-v="mando" class="on">Mando</button><button data-v="voto">Votos</button><button data-v="preg">Preguntas<em id="badge" class="oculto">0</em></button><button data-v="ir">Ir a</button>
  </div>
  <div class="vista on" id="v-mando">
    <div class="notas" id="notas">Abrí la presentación en la computadora y conectala con la tecla C para ver tus notas acá.</div>
    <div class="fila"><button class="chico" id="btBlanco">Pantalla en blanco</button><button class="chico" id="btReloj">Reiniciar reloj</button></div>
    <div class="mandos"><button id="btAtras">◀ Volver</button><button id="btSig">Siguiente ▶</button></div>
  </div>
  <div class="vista" id="v-voto"><div class="scroll" id="votoLista"></div></div>
  <div class="vista" id="v-preg"><div class="scroll" id="pregLista"></div></div>
  <div class="vista" id="v-ir"><div class="scroll" id="irLista"></div></div>
  <div class="estado" id="estado"><i></i><span id="estadoTx">Conectando…</span><button id="btSalir" type="button">Salir</button></div>
</section>
<script>
(function(){
var LS={get:function(k){try{return localStorage.getItem('control_'+k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem('control_'+k,v)}catch(e){}},del:function(k){try{localStorage.removeItem('control_'+k)}catch(e){}}};
var token=LS.get('token'),S=null,desfase=0,blanco=false,timer=null,firmas={};
function $(i){return document.getElementById(i)}
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
function api(r,d){var h={};if(token)h.Authorization='Bearer '+token;var o={headers:h,cache:'no-store'};if(d){o.method='POST';h['Content-Type']='application/json';o.body=JSON.stringify(d)}
 return fetch('/api/'+r,o).then(function(x){return x.json().then(function(j){if(!x.ok){var e=new Error(j.error||'Error');e.estado=x.status;throw e}return j})})}
function vibrar(){if(navigator.vibrate)navigator.vibrate(12)}
function cambio(f){return function(k,v){var s=JSON.stringify(v);if(firmas[k]===s)return false;firmas[k]=s;return true}}
var cambia=cambio();

/* PIN */
var dig='';
['1','2','3','4','5','6','7','8','9','⌫','0','OK'].forEach(function(k){var b=el('button',k==='OK'?'entrar':null,k);b.type='button';b.setAttribute('aria-label',k==='⌫'?'Borrar':k==='OK'?'Entrar':k);b.addEventListener('click',function(){tecla(k)});$('teclas').appendChild(b)});
function puntos(){var p=$('puntos');p.textContent='';for(var i=0;i<dig.length;i++)p.appendChild(el('i'))}
function tecla(k){if(k==='OK'){if(dig.length>=4)entrar();return}if(k==='⌫')dig=dig.slice(0,-1);else if(dig.length<8)dig+=k;puntos()}
function entrar(){$('pinMsg').textContent='Verificando…';api('login',{pin:dig}).then(function(r){token=r.token;LS.set('token',token);dig='';puntos();arrancar()}).catch(function(e){dig='';puntos();$('pinMsg').textContent=e.estado?e.message:'No se pudo conectar. Revisá internet.'})}
function salir(){token=null;S=null;LS.del('token');clearTimeout(timer);$('app').classList.add('oculto');$('pin').classList.remove('oculto');$('pinMsg').textContent='Ingresá tu PIN'}
$('btSalir').addEventListener('click',salir);

/* pestañas */
$('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});
 ['mando','voto','preg','ir'].forEach(function(v){$('v-'+v).classList.toggle('on',v===b.dataset.v)})});

function aviso(t){$('estadoTx').textContent=t}
function comando(tipo,valor){vibrar();return api('comando',{tipo:tipo,valor:valor}).catch(function(e){if(e.estado===401)salir();else aviso('No se pudo enviar: revisá la conexión')})}
function accion(ruta,datos,listo){vibrar();return api(ruta,datos).then(function(){if(listo)aviso(listo);firmas={};leer()}).catch(function(e){if(e.estado===401)salir();else aviso('No se pudo hacer: probá de nuevo')})}
$('btSig').addEventListener('click',function(){comando('siguiente')});
$('btAtras').addEventListener('click',function(){comando('anterior')});
$('btBlanco').addEventListener('click',function(){blanco=!blanco;this.classList.toggle('activo',blanco);this.textContent=blanco?'Volver a mostrar':'Pantalla en blanco';comando('blanco',blanco)});
$('btReloj').addEventListener('click',function(){if(confirm('¿Reiniciar el reloj de la charla?'))comando('reloj')});

function mmss(s){var n=Math.max(0,Math.round(s));return ('0'+Math.floor(n/60)).slice(-2)+':'+('0'+n%60).slice(-2)}
setInterval(function(){if(!S)return;if(!S.relojInicio){$('relojT').textContent='00:00';$('relojP').textContent='sin iniciar';return}
 $('relojT').textContent=mmss((Date.now()+desfase-new Date(S.relojInicio).getTime())/1000);$('relojP').textContent='de charla'},1000);

function pintarVotos(){if(!cambia('votos',[S.encuestas,S.conteos,S.abierta,S.participantes,S.palabras]))return;
 var c=$('votoLista');c.textContent='';
 c.appendChild(el('div','vacio',S.participantes+(S.participantes===1?' persona participó':' personas participaron')+' en la charla'));
 if(!S.encuestas.length)c.appendChild(el('div','vacio','No hay votación en esta diapositiva.'));
 S.encuestas.forEach(function(enc){var b=el('div','bloque');b.appendChild(el('h2',null,enc.pregunta));
  if(enc.tipo==='texto'){var l=(S.palabras||{})[enc.id]||[];if(!l.length)b.appendChild(el('div','vacio','Todavía no hay respuestas.'));
   l.forEach(function(w){var f=el('div','palabra');f.appendChild(el('span',null,w.texto+' · '+w.n));var x=el('button',null,'Quitar');x.addEventListener('click',function(){accion('ocultar',{encuesta:enc.id,clave:w.clave})});f.appendChild(x);b.appendChild(f)})}
  else{var ct=S.conteos[enc.id]||{},tot=Object.keys(ct).reduce(function(a,k){return a+ct[k]},0);
   enc.opciones.forEach(function(o){var n=ct[o.id]||0,f=el('div','barra');f.appendChild(el('span',null,o.id+' · '+o.texto));f.appendChild(el('b',null,n));var t=el('div'),i=el('i');i.style.width=(tot?n/tot*100:0)+'%';t.appendChild(i);f.appendChild(t);b.appendChild(f)})}
  var lp=el('button','chico','Limpiar esta pregunta');lp.style.cssText='width:100%;margin-top:14px';lp.addEventListener('click',function(){if(confirm('¿Borrar las respuestas de esta pregunta? Los celulares pueden volver a responder.'))accion('limpiar',{encuesta:enc.id},'Listo, respuestas borradas')});b.appendChild(lp);c.appendChild(b)});
 if(S.encuestas.length){var g=el('button','grande'+(S.abierta?' cerrar':''),S.abierta?'Cerrar votación':'Abrir votación');g.addEventListener('click',function(){accion('votacion',{abierta:!S.abierta})});c.appendChild(g)}
 var r=el('button','peligro','Limpiar todos los datos');r.addEventListener('click',function(){if(confirm('Se borran los votos, las palabras y las preguntas. La presentación sigue donde está. ¿Seguro?'))accion('reiniciar',{},'Listo, datos borrados')});c.appendChild(r)}

function pintarPreguntas(){if(!cambia('preg',[S.pendientes,S.aprobadas,S.recibePreguntas]))return;
 var c=$('pregLista');c.textContent='';
 var rec=el('button','chico'+(S.recibePreguntas?'':' activo'),S.recibePreguntas?'Dejar de recibir preguntas':'Volver a recibir preguntas');rec.style.flex='none';rec.addEventListener('click',function(){accion('recepcion',{recibe:!S.recibePreguntas})});c.appendChild(rec);
 c.appendChild(el('div','sec','Por aprobar ('+S.pendientes.length+')'));
 if(!S.pendientes.length)c.appendChild(el('div','vacio','No hay preguntas nuevas.'));
 S.pendientes.forEach(function(p){var b=el('div','preg',p.texto),a=el('div','acc'),no=el('button',null,'Descartar'),si=el('button','si','Mostrar');no.addEventListener('click',function(){accion('moderar',{id:p.id,estado:'rechazada'})});si.addEventListener('click',function(){accion('moderar',{id:p.id,estado:'aprobada'})});a.appendChild(no);a.appendChild(si);b.appendChild(a);c.appendChild(b)});
 var ab=S.aprobadas.filter(function(p){return p.estado==='aprobada'});
 c.appendChild(el('div','sec','En pantalla ('+ab.length+')'));
 ab.forEach(function(p){var b=el('div','preg','▲ '+p.apoyos+'  '+p.texto),a=el('div','acc'),h=el('button',null,'Marcar respondida');h.addEventListener('click',function(){accion('moderar',{id:p.id,estado:'respondida'})});a.appendChild(h);b.appendChild(a);c.appendChild(b)})}

function pintarIndice(){if(!cambia('indice',[S.indice,S.diapositiva]))return;var c=$('irLista');c.textContent='';
 if(!(S.indice||[]).length)c.appendChild(el('div','vacio','El índice aparece cuando la presentación se conecta.'));
 (S.indice||[]).forEach(function(d){var b=el('button','dia'+(d.n===S.diapositiva?' act':''));b.appendChild(el('b',null,('0'+d.n).slice(-2)));b.appendChild(el('span',null,d.titulo));b.addEventListener('click',function(){comando('ir',d.n)});c.appendChild(b)})}

function pintar(){$('dNum').textContent=S.diapositiva;$('dTot').textContent=S.total||'–';$('dTit').textContent=(S.titulo||S.charla||'')+(S.pasos?' · paso '+S.paso+' de '+S.pasos:'');
 if(cambia('notas',S.notas)){$('notas').textContent=S.notas||'Sin notas en esta diapositiva.';$('notas').scrollTop=0}
 var pend=S.pendientes.length;$('badge').textContent=pend;$('badge').classList.toggle('oculto',!pend);
 var vivo=S.latido&&(new Date(S.ahora)-new Date(S.latido))<20000;$('estado').classList.toggle('ok',!!vivo);aviso(vivo?'Presentación conectada':'La presentación no está conectada: abrila y tocá la tecla C');
 pintarVotos();pintarPreguntas();pintarIndice()}

function leer(){clearTimeout(timer);if(!token)return;
 api('panel').then(function(r){S=r;desfase=new Date(r.ahora).getTime()-Date.now();pintar()}).catch(function(e){if(e.estado===401){salir();return}$('estado').classList.remove('ok');aviso(e.estado?e.message:'Sin conexión: reintentando…')})
  .then(function(){if(token)timer=setTimeout(leer,document.hidden?4000:1000)})}
function arrancar(){$('pin').classList.add('oculto');$('app').classList.remove('oculto');firmas={};leer()}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&token)leer()});
if(token)arrancar();
})();
</script>
</body>
</html>
