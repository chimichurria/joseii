<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Charla en vivo</title>
<style>
:root{color-scheme:light;--c1:#FF3300;--c2:#FF9900;--gray:#5f6a6e;--steel:#485458;--ink:#1B1F21;--line:#E4E7E8;--ease:cubic-bezier(.2,.75,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.marca{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vivo{display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--steel);white-space:nowrap;flex:none}
.vivo i{width:9px;height:9px;border-radius:50%;background:#2fa36b;display:block;margin-right:7px}
.vivo.off i{background:var(--c2)}
main{flex:1;display:flex;flex-direction:column}
h1{font-size:clamp(25px,7vw,32px);line-height:1.15;font-weight:700;letter-spacing:-.01em;margin-bottom:6px;overflow-wrap:anywhere}
.ayuda{font-size:16px;color:var(--gray);margin-bottom:20px;line-height:1.4}
.bloque+.bloque{margin-top:30px;padding-top:26px;border-top:1px solid var(--line)}
.ops{display:flex;flex-direction:column;gap:11px}
.op{display:flex;align-items:center;width:100%;min-height:68px;padding:14px 16px;border:2px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);font:inherit;font-size:19px;font-weight:700;text-align:left;cursor:pointer;transition:transform .15s var(--ease),border-color .2s,background .2s,color .2s}
.op:active{transform:scale(.98)}
.op .le{flex:none;margin-right:14px;width:38px;height:38px;border-radius:12px;background:#F3F4F5;color:var(--c1);display:flex;align-items:center;justify-content:center;font-size:17px}
.op.sel{border-color:transparent;background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff}
.op.sel .le{background:rgba(255,255,255,.22);color:#fff}
.op:disabled{cursor:default}
.ok{min-height:26px;margin-top:14px;font-size:16px;font-weight:700;color:var(--steel);text-align:center}
.espera{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 10px;gap:18px}
.espera h1{margin-bottom:0}
.espera p{font-size:17px;line-height:1.45;color:var(--gray);max-width:30ch}
.pulso{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));animation:pulso 2.2s ease-in-out infinite}
@keyframes pulso{0%,100%{transform:scale(.86);opacity:.75}50%{transform:scale(1);opacity:1}}
.pestana{margin-top:26px}
.boton{width:100%;min-height:56px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer}
.boton.pri{border:0;background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff}
.boton:disabled{opacity:.55}
.panel{display:none;margin-top:18px}
.panel.on{display:block}
textarea{width:100%;min-height:104px;padding:14px;border:1.5px solid var(--line);border-radius:14px;font:inherit;font-size:17px;line-height:1.4;color:var(--ink);resize:vertical;background:#fff}
textarea:focus-visible,.op:focus-visible,.boton:focus-visible,.caja:focus-visible{outline:3px solid rgba(255,51,0,.35);outline-offset:2px}
.cont{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 12px;font-size:14px;color:var(--gray)}
.lista{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:10px}
.lista li{display:flex;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;font-size:16px;line-height:1.4}
.lista li.hecha{opacity:.55}
.lista p{flex:1;overflow-wrap:anywhere;margin-right:12px}
.apoyo{flex:none;min-width:58px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:15px;font-weight:700;color:var(--steel);cursor:pointer}
.apoyo.si{border-color:var(--c1);color:var(--c1)}
.sub{font-size:15px;font-weight:700;color:var(--steel);margin-top:22px}
.vacio{margin-top:14px;font-size:15px;color:var(--gray)}
.aviso{margin-top:10px;font-size:15px;color:#B42318;min-height:20px;text-align:center}
.caja{width:100%;min-height:62px;padding:14px 16px;border:2px solid var(--line);border-radius:16px;font:inherit;font-size:19px;color:var(--ink);background:#fff;margin-bottom:12px}
.avance{display:none;margin-bottom:18px}
.avance.on{display:block}
.avance p{font-size:13px;font-weight:700;color:var(--steel);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avance div{height:5px;border-radius:3px;background:#EEF0F1;overflow:hidden}
.avance i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .5s var(--ease)}
@media (prefers-reduced-motion:reduce){.pulso{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="marca" id="marca">Charla en vivo</div>
  <div class="vivo off" id="vivo"><i></i><span id="vivoTx">CONECTANDO</span></div>
</header>
<div class="avance" id="avance" aria-hidden="true"><p id="avTx"></p><div><i id="avBar"></i></div></div>
<main>
  <section id="zona" aria-live="polite" style="flex:1;display:flex;flex-direction:column"></section>
  <div class="pestana">
    <button class="boton" id="abrirP" aria-expanded="false">Hacer una pregunta</button>
    <div class="panel" id="panelP">
      <form id="formP">
        <label class="sub" for="textoP" style="display:block;margin:0 0 8px">Tu pregunta es anónima</label>
        <textarea id="textoP" maxlength="200" placeholder="Escribí tu pregunta acá"></textarea>
        <div class="cont"><span id="estadoP"></span><span id="largoP">0 / 200</span></div>
        <button class="boton pri" id="enviarP" type="submit">Enviar pregunta</button>
      </form>
      <div class="aviso" id="avisoP"></div>
      <h2 class="sub">Preguntas de la sala</h2>
      <ul class="lista" id="listaP"></ul>
      <p class="vacio" id="vacioP">Todavía no hay preguntas en pantalla.</p>
    </div>
  </div>
</main>
<script>
(function(){
var LS={get:function(k){try{return localStorage.getItem('sala_'+k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem('sala_'+k,v)}catch(e){}}};
function nuevoId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)+Math.random().toString(36).slice(2)}
function leerJson(k){try{return JSON.parse(LS.get(k)||'{}')}catch(e){return {}}}
var disp=LS.get('disp');if(!disp){disp=nuevoId();LS.set('disp',disp)}
var votos=leerJson('votos'),textos=leerJson('textos'),apoyadas=leerJson('apoyos');
var zona=document.getElementById('zona'),firma='',fallos=0,temporizador=null,momentoPrevio='',rondaVista=LS.get('ronda');

function api(ruta,datos){var op=datos?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(datos)}:{};
 return fetch('/api/'+ruta,op).then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||'Error');e.estado=r.status;throw e}return j})})}
function el(tag,cl,tx){var n=document.createElement(tag);if(cl)n.className=cl;if(tx!=null)n.textContent=tx;return n}

// Cuando el presentador limpia los datos, cada celular olvida lo que votó.
function revisarRonda(st){var r=String(st.ronda||0);if(rondaVista===r)return;var primera=rondaVista===null;rondaVista=r;LS.set('ronda',r);if(primera)return;
 votos={};textos={};apoyadas={};LS.set('votos','{}');LS.set('textos','{}');LS.set('apoyos','{}');firma=''}
function avance(st){var a=document.getElementById('avance');if(!st.enVivo||!st.total){a.className='avance';return}a.className='avance on';
 document.getElementById('avTx').textContent='Vamos por la '+st.diapositiva+' de '+st.total+(st.titulo?' · '+st.titulo:'');
 document.getElementById('avBar').style.width=(st.diapositiva/st.total*100)+'%'}
function esperando(titulo,texto){var e=el('div','espera');e.appendChild(el('div','pulso'));e.appendChild(el('h1',null,titulo));e.appendChild(el('p',null,texto));zona.appendChild(e)}

function pintar(st){
 revisarRonda(st);avance(st);
 if(st.charla){document.getElementById('marca').textContent=st.charla;document.title=st.charla}
 if(st.momento==='preguntas'&&momentoPrevio!=='preguntas'&&!panel.classList.contains('on'))abrirP.click();
 momentoPrevio=st.momento;
 var sig=JSON.stringify([st.encuestas,st.abierta,st.momento,st.enVivo]);
 if(sig===firma)return;firma=sig;zona.textContent='';
 if(!st.encuestas.length){
  if(st.momento==='preguntas')esperando('Te toca preguntar','Escribí tu pregunta abajo. Es anónima.');
  else if(!st.enVivo)esperando('La charla todavía no empezó','Dejá esta página abierta: cuando arranque, las preguntas aparecen solas.');
  else esperando('Esperando la próxima pregunta','Dejá esta página abierta: la pregunta aparece sola cuando llegue el momento.');
  return}
 st.encuestas.forEach(function(enc){
  var b=el('div','bloque');b.appendChild(el('h1',null,enc.pregunta));if(enc.ayuda)b.appendChild(el('p','ayuda',enc.ayuda));
  if(enc.tipo==='texto'){cajaTexto(b,enc,st.abierta);zona.appendChild(b);return}
  var cerrada='Votación cerrada. Mirá la pantalla.';
  var ops=el('div','ops'),ok=el('p','ok',!st.abierta?cerrada:votos[enc.id]?'Voto registrado. Podés cambiarlo.':'');
  ok.setAttribute('role','status');
  enc.opciones.forEach(function(o){var bt=el('button','op');bt.type='button';bt.disabled=!st.abierta;
   bt.appendChild(el('span','le',o.id));bt.appendChild(el('span',null,o.texto));
   if(votos[enc.id]===o.id)bt.classList.add('sel');
   bt.addEventListener('click',function(){votar(enc.id,o.id,ops,bt,ok)});ops.appendChild(bt)});
  b.appendChild(ops);b.appendChild(ok);zona.appendChild(b)})}

function cajaTexto(b,enc,abierta){var f=el('form'),i=el('input','caja'),bt=el('button','boton pri','Enviar'),ok=el('p','ok',!abierta?'Ya está cerrado. Mirá la pantalla.':textos[enc.id]?'Enviaste: '+textos[enc.id]+'. Podés cambiarla.':'');
 i.type='text';i.maxLength=32;i.placeholder='Escribí tu respuesta';i.autocomplete='off';i.setAttribute('aria-label','Tu respuesta');i.disabled=!abierta;bt.type='submit';bt.disabled=!abierta;ok.setAttribute('role','status');
 f.appendChild(i);f.appendChild(bt);b.appendChild(f);b.appendChild(ok);
 f.addEventListener('submit',function(ev){ev.preventDefault();var t=i.value.trim();if(t.length<2){ok.textContent='Escribí tu respuesta.';return}bt.disabled=true;ok.textContent='Enviando…';
  api('palabra',{encuesta:enc.id,texto:t,dispositivo:disp}).then(function(r){textos[enc.id]=r.texto;LS.set('textos',JSON.stringify(textos));i.value='';i.blur();ok.textContent='¡Listo! Mirá la pantalla: '+r.texto})
   .catch(function(e){ok.textContent=e.estado?e.message:'No se pudo enviar. Probá de nuevo.'}).then(function(){bt.disabled=false})})}

function votar(enc,op,ops,bt,ok){var previa=votos[enc];
 [].forEach.call(ops.children,function(x){x.classList.remove('sel')});bt.classList.add('sel');ok.textContent='Enviando…';
 api('votar',{encuesta:enc,opcion:op,dispositivo:disp}).then(function(){votos[enc]=op;LS.set('votos',JSON.stringify(votos));ok.textContent='Voto registrado. Podés cambiarlo.'}).catch(function(e){
  bt.classList.remove('sel');[].forEach.call(ops.children,function(x){if(previa&&x.firstChild.textContent===previa)x.classList.add('sel')});
  ok.textContent=e.estado===409?'La votación está cerrada.':e.estado===429?e.message:'No se pudo enviar. Probá de nuevo.'})}

function estadoRed(on){document.getElementById('vivo').classList.toggle('off',!on);document.getElementById('vivoTx').textContent=on?'EN VIVO':'RECONECTANDO'}
function ciclo(){clearTimeout(temporizador);if(document.hidden)return;
 api('estado').then(function(st){fallos=0;estadoRed(true);pintar(st);botonP(st.recibePreguntas)}).catch(function(){fallos++;estadoRed(false)}).then(function(){
  if(panel.classList.contains('on'))return cargarP()}).then(function(){temporizador=setTimeout(ciclo,Math.min(1000+fallos*900,9000)+Math.random()*300)})}
document.addEventListener('visibilitychange',function(){if(!document.hidden)ciclo()});
window.addEventListener('online',ciclo);

var abrirP=document.getElementById('abrirP'),panel=document.getElementById('panelP'),form=document.getElementById('formP'),texto=document.getElementById('textoP'),largo=document.getElementById('largoP'),aviso=document.getElementById('avisoP'),enviar=document.getElementById('enviarP');
abrirP.addEventListener('click',function(){var on=panel.classList.toggle('on');abrirP.setAttribute('aria-expanded',on);abrirP.textContent=on?'Cerrar preguntas':'Hacer una pregunta';if(on)cargarP()});
texto.addEventListener('input',function(){largo.textContent=texto.value.length+' / 200'});
function botonP(rec){enviar.disabled=!rec;document.getElementById('estadoP').textContent=rec?'':'Preguntas cerradas'}
form.addEventListener('submit',function(ev){ev.preventDefault();var t=texto.value.trim();if(t.length<3){aviso.textContent='Escribí tu pregunta.';return}
 enviar.disabled=true;aviso.textContent='';api('preguntar',{texto:t,dispositivo:disp}).then(function(){texto.value='';largo.textContent='0 / 200';aviso.style.color='#2a7d55';aviso.textContent='Recibida. Si se aprueba, aparece en pantalla.'})
  .catch(function(e){aviso.style.color='#B42318';aviso.textContent=e.estado?e.message:'No se pudo enviar.'}).then(function(){enviar.disabled=false})});
var firmaP='';
function cargarP(){return api('preguntas').then(function(r){var f=JSON.stringify(r.preguntas);if(f===firmaP)return;firmaP=f;var ul=document.getElementById('listaP');ul.textContent='';document.getElementById('vacioP').style.display=r.preguntas.length?'none':'block';
 r.preguntas.forEach(function(p){var li=el('li',p.estado==='respondida'?'hecha':'');li.appendChild(el('p',null,p.texto));
  var b=el('button','apoyo'+(apoyadas[p.id]?' si':''),'▲ '+p.apoyos);b.type='button';b.setAttribute('aria-label','Apoyar esta pregunta, '+p.apoyos+' apoyos');b.disabled=!!apoyadas[p.id]||p.estado==='respondida';
  b.addEventListener('click',function(){b.disabled=true;api('apoyar',{pregunta:p.id,dispositivo:disp}).then(function(){apoyadas[p.id]=1;LS.set('apoyos',JSON.stringify(apoyadas));b.classList.add('si');b.textContent='▲ '+(p.apoyos+1);firmaP=''}).catch(function(){b.disabled=false})});
  li.appendChild(b);ul.appendChild(li)})}).catch(function(){})}
ciclo();
})();
</script>
</body>
</html>
